# One production controller. Verify remains the credential-free PR/compatibility witness.
name: Website
on:
  push:
    branches: [main]
    # Inputs consumed by the build, Worker or its mandatory validation. Internal docs,
    # brand masters and authoring tools publish only after their consumed exports change.
    paths:
      - 'src/**'
      - 'public/**'
      - 'worker/**'
      - 'shared/**'
      - 'brand/bundle/works/**'
      - 'design/the-walk/assets/**'
      - 'design/yoru/sheets/**'
      - 'tools/brand-bundle/**'
      - 'tools/yoru-studio/lib/**'
      - 'scripts/build-production.mjs'
      - 'scripts/check-output.mjs'
      - 'scripts/check-publish.mjs'
      - 'scripts/check-deployment.mjs'
      - 'scripts/check-live-https.mjs'
      - 'scripts/prepare-fonts.mjs'
      - 'scripts/generate-identity-assets.mjs'
      - 'scripts/write-headers.mjs'
      - 'scripts/yoru-families.mjs'
      - 'tests/unit/**'
      - 'tests/worker/**'
      - 'tests/fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'astro.config.mjs'
      - 'site.config.mjs'
      - 'tsconfig.json'
      - 'tsconfig.worker.json'
      - 'vitest.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: works-website-production
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      # Presence flags only: no raw credential reaches checkout, install or fixture checks.
      - name: Refuse an unconfigured publication
        env:
          HAS_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_OPERATOR: ${{ secrets.WOLFSBLVT_LEGAL_OPERATOR_B64 != '' }}
        run: |
          missing=()
          [ "$HAS_ACCOUNT" = true ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ "$HAS_TOKEN" = true ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ "$HAS_OPERATOR" = true ] || missing+=(WOLFSBLVT_LEGAL_OPERATOR_B64)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Publication not configured; missing: ${missing[*]}. Wolf Ops supplies these before activation. Nothing was built or deployed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolved only after the production job acquires its concurrency slot.
          ref: main
          persist-credentials: false
      - name: Record the source actually built
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'Production source: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate with the public fixture
        run: npm run check
      - name: Build for publication
        env:
          WOLFSBLVT_LEGAL_OPERATOR_B64: ${{ secrets.WOLFSBLVT_LEGAL_OPERATOR_B64 }}
        # The fixture check above supplies ordinary diagnostics. Keep private build/error
        # output out of Actions logs and artifacts, including on failure.
        run: |
          if ! npm run build:production >/dev/null 2>&1; then
            echo '::error::Production build/publication gate refused. Use contained local qualification to diagnose; private build output is not retained.'
            exit 1
          fi
      - name: Stamp the public asset build
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: printf '%s\n' "$SOURCE_SHA" > artifacts/site/build-version.txt
      - name: Deploy accepted main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test -x node_modules/.bin/wrangler
          node_modules/.bin/wrangler deploy --config wrangler.jsonc --env production --keep-vars --var "BUILD_VERSION:$SOURCE_SHA"
      - name: Read back both public hosts
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/check-deployment.mjs "$SOURCE_SHA"
