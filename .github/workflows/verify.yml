name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6, reviewed metadata 2026-09-15
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6, reviewed metadata 2026-09-15
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked packages
        run: npm ci --no-audit --no-fund
      # Types, unit and workerd tests, the build with fixture legal data, and the output check. The browser suite
      # (npm run qa) and the publication gate run locally; neither belongs on every push of an unpublished site.
      - name: Verify
        run: npm run check
