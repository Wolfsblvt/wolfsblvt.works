name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Exercise Astro's exact supported floor; a bare 22 can select an older runner-cached patch.
        node: ['22.23.4', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, reviewed metadata 2026-09-15
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, reviewed metadata 2026-09-15
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked packages
        run: npm ci --no-audit --no-fund
      # Types, unit and workerd tests, the build with fixture legal data, and the output check. The browser suite
      # (npm run qa) stays separate. Website runs the private production build/gate only on accepted main.
      - name: Verify
        run: npm run check


      # Candidate-only qualification. Removed after this finite follow-up qualification.
      - name: Install candidate browser
        if: matrix.node == '24' && github.event_name == 'pull_request' && github.event.pull_request.number == 25
        run: npx playwright install --with-deps chromium

      - name: Qualify consulting and contact journeys
        if: matrix.node == '24' && github.event_name == 'pull_request' && github.event.pull_request.number == 25
        timeout-minutes: 5
        run: npx playwright test tests/e2e/contact.spec.ts tests/e2e/commission.spec.ts

      - name: Capture candidate browser evidence
        if: always() && matrix.node == '24' && github.event_name == 'pull_request' && github.event.pull_request.number == 25
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: works-consulting-browser-evidence
          path: artifacts/test-results/
          retention-days: 7
